<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuuki Bot - Admin Panel</title>
<link rel="icon" type="image/jpeg" href="/assets/profiles/1%20(4).jpeg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--surface:#0a0a0a;--surface2:#111;--surface3:#1a1a1a;--border:#1e1e1e;--border2:#2a2a2a;--text:#fff;--text2:#a0a0a0;--text3:#666;--blue:#2563eb;--blue-hover:#3b82f6;--blue-light:#60a5fa;--blue-dark:#1d4ed8;--red:#ef4444;--green:#22c55e;--radius:10px;--radius-sm:6px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
input,select,button,textarea{font-family:inherit}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 50% 0%,#0a1628 0%,#000 70%)}
.login-box{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:400px}
.login-logo{width:52px;height:52px;background:linear-gradient(135deg,var(--blue),#7c3aed);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:22px;font-weight:700;color:#fff;box-shadow:0 8px 32px rgba(37,99,235,.3)}
.login-box h1{font-size:22px;margin-bottom:4px;text-align:center;font-weight:600}
.login-box .sub{color:var(--text2);text-align:center;margin-bottom:28px;font-size:13px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.form-group input{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;transition:all .2s}
.form-group input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.form-group input::placeholder{color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-hover);box-shadow:0 4px 16px rgba(37,99,235,.35)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{background:var(--surface3);color:var(--text);border-color:var(--border2)}
.btn-icon{background:transparent;border:none;color:var(--text2);padding:6px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{background:var(--surface3);color:var(--text)}
.btn-block{width:100%}
.error-msg{color:var(--red);font-size:13px;text-align:center;margin-top:14px;display:none}

/* App layout */
.app{display:none;height:100vh;overflow:hidden;background:var(--bg)}

/* Sidebar */
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-header .brand{width:30px;height:30px;border-radius:8px;flex-shrink:0;object-fit:cover}
.sidebar-header .brand-fallback{display:flex;align-items:center;justify-content:center}
.sidebar-header .brand-text{font-size:14px;font-weight:600}
.sidebar-header .brand-text span{color:var(--text2);font-weight:400}
.sidebar-search{padding:10px 12px;position:relative}
.sidebar-search input{width:100%;padding:8px 10px 8px 32px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;outline:none}
.sidebar-search input:focus{border-color:var(--blue)}
.sidebar-search input::placeholder{color:var(--text3)}
.sidebar-search svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text3)}
.model-list{list-style:none;flex:1;overflow-y:auto;padding:6px 0}
.model-list li{padding:9px 14px;margin:1px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .12s;display:flex;align-items:center;gap:8px}
.model-list li:hover{background:var(--surface3);color:var(--text)}
.model-list li.active{background:rgba(37,99,235,.15);color:var(--blue-light)}
.model-list li.active .model-dot{background:var(--blue)!important;box-shadow:0 0 8px rgba(37,99,235,.4)}
.model-dot{width:5px;height:5px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:all .15s}
.hamburger{display:none;flex-direction:column;gap:3px;cursor:pointer;background:none;border:none;padding:4px 2px}
.hamburger span{display:block;width:16px;height:2px;background:var(--text);border-radius:1px}
.sort-arrow{display:inline-block;width:0;height:0;margin-left:4px;vertical-align:middle}
.sort-arrow.asc{border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:5px solid var(--blue-light)}
.sort-arrow.desc{border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--blue-light)}
.btn-svg svg{width:14px;height:14px;flex-shrink:0}
.model-list li .badge{font-size:10px;color:var(--text3);margin-left:auto;background:var(--surface3);padding:1px 6px;border-radius:4px}
.model-list li.active .badge{background:rgba(37,99,235,.2);color:var(--blue-light)}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:6px}
.sidebar-footer .btn{flex:1;font-size:11px;padding:7px 10px}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;height:52px}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-left h3{font-size:15px;font-weight:600}
.topbar-badge{font-size:10px;background:var(--surface3);color:var(--text2);padding:2px 8px;border-radius:4px;font-weight:500}
.topbar-right{display:flex;align-items:center;gap:12px}
.connection{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.connection .dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Toolbar */
.toolbar{background:var(--surface);padding:0 20px;display:none;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;height:48px}
.toolbar.show{display:flex}
.search-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;display:flex;align-items:center;gap:8px;flex:1;min-width:160px;max-width:280px;transition:border .2s}
.search-box:focus-within{border-color:var(--blue)}
.search-box svg{width:15px;height:15px;color:var(--text3);flex-shrink:0}
.search-box input{background:none;border:none;color:var(--text);font-size:13px;outline:none;width:100%}
.search-box input::placeholder{color:var(--text3)}
.sort-group{display:flex;gap:6px;align-items:center}
.sort-group select{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:6px 10px;font-size:12px;outline:none;cursor:pointer}
.sort-group select:focus{border-color:var(--blue)}
.pagination{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin-left:auto}
.pagination .page-btn{background:var(--surface3);border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:all .15s}
.pagination .page-btn:hover:not(:disabled){background:var(--blue);border-color:var(--blue);color:#fff}
.pagination .page-btn:disabled{opacity:.3;cursor:default}
.pagination .page-info{color:var(--text2);padding:0 4px}
.pagination .page-total{color:var(--text3)}

/* Content table */
.content{flex:1;overflow:auto}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
thead{position:sticky;top:0;z-index:1}
th{background:var(--surface);padding:9px 14px;text-align:left;font-weight:500;color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}
th:hover{color:var(--text2)}
th.sorted{color:var(--blue-light)}

td{padding:9px 14px;border-bottom:1px solid var(--border);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
tr.deleted td{opacity:.2;text-decoration:line-through}
tr.deleted .actions button{pointer-events:none}
.cell-id{font-family:'SF Mono','Cascadia Code',monospace;font-size:12px;color:var(--blue-light)}
.cell-id.id-pk{color:#f59e0b}
.cell-bool{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.cell-bool.true{background:rgba(34,197,94,.12);color:var(--green)}
.cell-bool.false{background:rgba(239,68,68,.1);color:var(--red)}
.cell-date{font-size:11px;color:var(--text2)}
.cell-null{color:var(--text3);font-style:italic;font-size:12px}
.cell-number{font-family:'SF Mono',monospace;color:var(--text)}
.actions{display:flex;gap:3px;opacity:0;transition:opacity .15s}
tr:hover .actions{opacity:1}
.actions button{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:var(--radius-sm);font-size:13px;transition:all .15s;color:var(--text2)}
.actions .edit-btn:hover{background:rgba(37,99,235,.15);color:var(--blue-light)}
.actions .del-btn:hover{background:rgba(239,68,68,.15);color:var(--red)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.6)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h4{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal-header h4 .model-tag{background:rgba(37,99,235,.15);color:var(--blue-light);font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;padding:4px;border-radius:var(--radius-sm);line-height:1;transition:all .15s}
.modal-close:hover{color:var(--text);background:var(--surface3)}
.modal-body{padding:20px;overflow-y:auto}
.modal-body .field{margin-bottom:14px}
.modal-body .field:last-child{margin-bottom:0}
.modal-body .field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.modal-body .field input,.modal-body .field select,.modal-body .field textarea{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;transition:border .2s}
.modal-body .field textarea{min-height:56px;resize:vertical}
.modal-body .field input:focus,.modal-body .field select:focus,.modal-body .field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.modal-body .field input:disabled{opacity:.4;cursor:not-allowed}
.modal-body .field .hint{font-size:11px;color:var(--text3);margin-top:4px}
.modal-body .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}

/* Loading & Empty */
.loading{display:flex;align-items:center;justify-content:center;padding:80px 20px;color:var(--text2);gap:12px;flex-direction:column}
.spinner{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading span{font-size:13px}
.empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--text3)}
.empty-state.show{display:flex}
.empty-state svg{width:44px;height:44px;margin-bottom:16px;opacity:.3}
.empty-state p{font-size:14px;text-align:center}
.empty-state .sub-text{font-size:12px;color:var(--text3);margin-top:4px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;z-index:200;transform:translateY(100px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;gap:8px;font-weight:500}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#0a2e1a;border:1px solid #166534;color:var(--green)}
.toast.error{background:#2e0a0a;border:1px solid #991b1b;color:var(--red)}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* Mobile */
@media(max-width:768px){
.sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:50;transition:left .25s ease;width:260px}
.sidebar.open{left:0;box-shadow:10px 0 40px rgba(0,0,0,.5)}
.sidebar-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:49;display:none}
.sidebar-overlay.show{display:block}
.main{width:100%}
.topbar{padding:0 14px}
.topbar h3{font-size:14px}
.menu-btn{display:flex!important;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px 2px;line-height:1}
.toolbar{padding:0 14px;height:auto;flex-wrap:wrap;gap:6px;min-height:44px}
.search-box{min-width:120px;max-width:none}
.sort-group select{font-size:11px;padding:5px 8px}
th,td{padding:7px 10px;font-size:12px}
td{max-width:150px}
.actions{opacity:1}
.login-box{padding:28px 24px}
.modal-body .field-row{grid-template-columns:1fr}
}
.menu-btn{display:none}
@media(max-width:768px){
.menu-btn{display:flex!important}
}

/* Row count badge */
.row-count{font-size:11px;color:var(--text3);background:var(--surface3);padding:3px 10px;border-radius:4px}
.cb-cell{width:32px;padding:0 0 0 8px!important}
.cb-cell input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px;cursor:pointer;vertical-align:middle}
.bulk-bar{display:none;align-items:center;gap:8px;padding:8px 20px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:13px;flex-shrink:0}
.bulk-bar.show{display:flex}
.bulk-bar .count{color:var(--blue-light);font-weight:600}
th .cb-all{accent-color:var(--blue);width:15px;height:15px;cursor:pointer;vertical-align:middle}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">Y</div>
    <h1>Admin Panel</h1>
    <p class="sub">Yuuki Sorimachi Bot v2.0</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      <div class="error-msg" id="loginError">Invalid credentials</div>
    </form>
  </div>
</div>

<div class="app" id="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img class="brand" src="/assets/profiles/1%20(4).jpeg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="brand-fallback" style="display:none;width:30px;height:30px;background:linear-gradient(135deg,var(--blue),#7c3aed);border-radius:8px;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">Y</div>
      <div class="brand-text">Yuuki Bot <span>· Admin</span></div>
    </div>
    <div class="sidebar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="modelSearch" placeholder="Search models..." oninput="filterModels()">
    </div>
    <ul class="model-list" id="modelList"></ul>
    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-svg" onclick="refreshModels()" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg></button>
      <button class="btn btn-ghost" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        <h3 id="currentModel">Database Manager</h3>
        <span class="topbar-badge" id="modelBadge" style="display:none"></span>
      </div>
      <div class="topbar-right">
        <div class="connection"><span class="dot" id="statusDot"></span><span id="dbInfo">Checking...</span></div>
      </div>
    </div>

    <div class="toolbar" id="toolbar">
      <button class="btn btn-sm btn-ghost btn-svg" onclick="syncNames()" title="Sync usernames from User to UserProgress & History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg> Sync</button>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search..." oninput="debounceSearch()">
      </div>
      <div class="sort-group">
        <select id="sortSelect" onchange="loadData()">
          <option value="">Sort</option>
        </select>
        <select id="sortOrder" onchange="loadData()">
          <option value="desc">Desc</option>
          <option value="asc">Asc</option>
        </select>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

    <div class="bulk-bar" id="bulkBar">
      <span><span class="count" id="bulkCount">0</span> selected</span>
      <button class="btn btn-sm btn-danger" onclick="bulkDelete()" id="bulkDeleteBtn">Delete Selected</button>
      <button class="btn btn-sm btn-ghost" onclick="clearSelection()">Clear</button>
    </div>
    <div class="content" id="content">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Loading data...</span>
      </div>
      <div class="empty-state show" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        <p>Select a table from the sidebar</p>
        <p class="sub-text">Choose a model to browse and manage data</p>
      </div>
      <div class="table-wrap" id="tableWrap" style="display:none">
        <table><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h4><span id="modalTitle">Edit</span> <span class="model-tag" id="modalModelTag"></span></h4>
      <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let state = { model: null, fields: [], data: [], page: 1, total: 0, limit: 50, sort: '', order: 'desc', search: '', sortable: [], editingId: null, selectedIds: new Set() };
let searchTimer = null;
let modelCache = [];

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'include', ...opts });
  if (res.status === 401) { throw new Error('Unauthorized'); }
  if (!res.ok) { const e = await res.json().catch(() => ({ error: res.statusText })); throw new Error(e.error || 'Request failed'); }
  return res.json();
}

document.getElementById('loginForm').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('loginError');
  try {
    await api('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('loginUser').value, password: document.getElementById('loginPass').value }),
    });
    err.style.display = 'none';
    initApp();
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
  }
};

async function initApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('emptyState').classList.add('show');
  document.getElementById('loading').style.display = 'none';
  await loadModels();
}

async function loadModels() {
  modelCache = await api('/api/models');
  renderModels(modelCache);
  if (state.model) selectModel(state.model);
}

function renderModels(models) {
  const ul = document.getElementById('modelList');
  ul.innerHTML = models.map(n => `<li onclick="selectModel('${n}')" data-model="${n}">
    <span class="model-dot"></span>${n}
  </li>`).join('');
}

function filterModels() {
  const q = document.getElementById('modelSearch').value.toLowerCase();
  renderModels(modelCache.filter(n => n.toLowerCase().includes(q)));
}

async function refreshModels() {
  await loadModels();
  toast('Models refreshed', 'success');
}

async function selectModel(name) {
  state.model = name;
  document.querySelectorAll('.model-list li').forEach(li => li.classList.toggle('active', li.dataset.model === name));
  document.getElementById('currentModel').textContent = name;
  document.getElementById('modelBadge').style.display = 'inline';
  document.getElementById('modelBadge').textContent = name;
  document.getElementById('emptyState').classList.remove('show');
  closeSidebar();
  await loadData();
}

async function loadData() {
  const m = state.model;
  if (!m) return;
  document.getElementById('toolbar').classList.add('show');
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('tableWrap').style.display = 'none';
  state.selectedIds = new Set();

  try {
    const params = new URLSearchParams({ page: state.page, limit: state.limit, sort: state.sort, order: state.order, search: state.search });
    const res = await api(`/api/model/${m}?${params}`);
    state.fields = res.fields;
    state.data = res.data;
    state.total = res.total;
    state.sortable = res.sortable;

    renderTable();
    renderPagination();
    renderSortSelect();
  } catch (ex) {
    document.getElementById('loading').innerHTML = `<span style="color:var(--red)">Error: ${ex.message}</span>`;
  }
}

function renderTable() {
  document.getElementById('loading').style.display = 'none';
  const tableWrap = document.getElementById('tableWrap');
  if (!state.data.length) {
    tableWrap.style.display = 'none';
    document.getElementById('emptyState').classList.add('show');
    document.getElementById('emptyState').querySelector('p').textContent = 'No records found';
    document.getElementById('emptyState').querySelector('.sub-text').textContent = 'Try a different search or model';
    return;
  }
  document.getElementById('emptyState').classList.remove('show');
  tableWrap.style.display = 'block';

  state.selectedIds = new Set();
  const displayFields = state.fields.filter(f => !f.isList).slice(0, 8);
  const thead = document.getElementById('tableHead');
  const allChecked = state.data.length > 0 && state.data.every(r => state.selectedIds?.has(String(r.id ?? r[Object.keys(r)[0]])));
  thead.innerHTML = '<th class="cb-cell"><input type="checkbox" class="cb-all" onchange="toggleAll(this.checked)" ' + (allChecked ? 'checked' : '') + '></th>' +
    '<th style="width:32px;padding:0">#</th>' + displayFields.map(f => {
    const isSorted = state.sort === f.name;
    return `<th class="${isSorted ? 'sorted' : ''}" onclick="setSort('${f.name}')">${f.name}${isSorted ? `<span class="sort-arrow ${state.order}"></span>` : ''}</th>`;
  }).join('') + '<th style="width:72px;padding-left:0">Actions</th>';

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = state.data.map((row, i) => {
    const rowId = row.id ?? i;
    const safeId = safeIdStr(rowId);
    const start = (state.page - 1) * state.limit;
    const checked = state.selectedIds?.has(safeId) ? 'checked' : '';
    return `<tr id="row-${safeId}">` +
      `<td class="cb-cell"><input type="checkbox" onchange="toggleRow('${safeId}')" ${checked}></td>` +
      `<td style="color:var(--text3);font-size:11px;width:32px;padding:0">${start + i + 1}</td>` +
      displayFields.map(f => `<td>${formatCell(row, f)}</td>`).join('') +
      `<td style="width:72px;padding-left:0"><div class="actions">
        <button class="edit-btn" onclick="openEdit('${safeId}')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="del-btn" onclick="deleteRecord('${safeId}')" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div></td>` +
      `</tr>`;
  }).join('');
  updateBulkBar();
}

function formatCell(row, field) {
  if (row[field.name] === null || row[field.name] === undefined) return '<span class="cell-null">—</span>';
  if (field.type === 'Boolean') return `<span class="cell-bool ${row[field.name]}">${row[field.name] ? 'true' : 'false'}</span>`;
  if (field.isId) return `<span class="cell-id id-pk">${esc(String(row[field.name]))}</span>`;
  if (field.name.endsWith('Id')) return `<span class="cell-id">${esc(String(row[field.name]))}</span>`;
  if (field.type === 'DateTime' || field.name.match(/^(createdAt|updatedAt|lastActive|expiredAt|muteUntil)$/i)) {
    const d = new Date(row[field.name]);
    if (isNaN(d.getTime())) return `<span class="cell-null">—</span>`;
    return `<span class="cell-date">${d.toLocaleDateString()} ${d.toLocaleTimeString()}</span>`;
  }
  if (field.type === 'Int' || field.type === 'Float') return `<span class="cell-number">${esc(String(row[field.name]))}</span>`;
  const v = String(row[field.name]);
  if (v.length > 60) return `<span title="${esc(v)}">${esc(v.slice(0, 55))}…</span>`;
  return esc(v);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderPagination() {
  const totalPages = Math.ceil(state.total / state.limit);
  document.getElementById('pagination').innerHTML = `
    <button class="page-btn" onclick="goPage(${state.page - 1})" ${state.page <= 1 ? 'disabled' : ''}>Prev</button>
    <span class="page-info">${state.page}<span style="color:var(--text3);margin:0 2px">/</span>${totalPages || 1}</span>
    <button class="page-btn" onclick="goPage(${state.page + 1})" ${state.page >= totalPages ? 'disabled' : ''}>Next</button>
    <span class="page-total">${state.total}</span>
  `;
}

function renderSortSelect() {
  const sel = document.getElementById('sortSelect');
  const current = sel.value;
  sel.innerHTML = '<option value="">Sort</option>' + state.sortable.map(s => `<option value="${s}" ${s === current ? 'selected' : ''}>${s}</option>`).join('');
}

function setSort(field) {
  if (state.sort === field) state.order = state.order === 'asc' ? 'desc' : 'asc';
  else { state.sort = field; state.order = 'desc'; }
  state.page = 1;
  loadData();
}

function goPage(p) {
  const totalPages = Math.ceil(state.total / state.limit);
  if (p < 1 || p > totalPages) return;
  state.page = p;
  loadData();
}

function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = document.getElementById('searchInput').value;
    state.page = 1;
    loadData();
  }, 300);
}

async function openEdit(id) {
  const row = state.data.find(r => String(r.id) === String(id));
  if (!row) return;
  state.editingId = id;
  document.getElementById('modalTitle').textContent = `Edit Record`;
  document.getElementById('modalModelTag').textContent = state.model;

  const fields = state.fields.filter(f => !f.isList && f.kind !== 'object');
  const body = document.getElementById('modalBody');
  body.innerHTML = fields.map((f, idx) => {
    const val = row[f.name];
    const isBool = f.type === 'Boolean';
    const isDateTime = f.type === 'DateTime';
    const isReadOnly = f.isId || f.name.match(/^(createdAt|updatedAt)$/i);
    const strVal = val === null || val === undefined ? '' : String(val);

    const wrapStart = idx % 2 === 0 && !isBool && !isReadOnly ? '<div class="field-row">' : '';
    const wrapEnd = (idx + 1) % 2 === 0 && !isBool && !isReadOnly ? '</div>' : '';

    let input;
    if (isBool) {
      input = `<div class="field"><label>${f.name}</label><select name="${f.name}">
        <option value="true" ${val === true ? 'selected' : ''}>true</option>
        <option value="false" ${val === false ? 'selected' : ''}>false</option>
      </select></div>`;
    } else if (isReadOnly) {
      input = `<div class="field"><label>${f.name}</label><input type="text" value="${esc(strVal)}" disabled><div class="hint">Read-only</div></div>`;
    } else if (isDateTime) {
      input = `<div class="field"><label>${f.name}</label><input type="text" name="${f.name}" value="${esc(strVal)}"><div class="hint">ISO date format</div></div>`;
    } else if (f.type === 'String' && strVal.length > 80) {
      input = `<div class="field"><label>${f.name}</label><textarea name="${f.name}">${esc(strVal)}</textarea></div>`;
    } else {
      input = `<div class="field"><label>${f.name}</label><input type="text" name="${f.name}" value="${esc(strVal)}"></div>`;
    }

    return (wrapStart ? `<div class="field-row">${input}` : input) + (wrapEnd || '');
  }).join('');

  document.getElementById('editModal').classList.add('show');
}

async function saveEdit() {
  const fields = state.fields.filter(f => !f.isList && f.kind !== 'object');
  const data = {};
  document.querySelectorAll('#modalBody [name]').forEach(el => {
    const name = el.getAttribute('name');
    const field = fields.find(f => f.name === name);
    if (!field || field.name.match(/^(createdAt|updatedAt)$/i) || field.isId) return;
    if (field.type === 'Boolean') data[name] = el.value === 'true';
    else if (field.type === 'Int') data[name] = el.value === '' ? null : parseInt(el.value);
    else if (field.type === 'Float') data[name] = el.value === '' ? null : parseFloat(el.value);
    else data[name] = el.value || null;
  });

  try {
    await api(`/api/model/${state.model}/${state.editingId}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
    });
    closeModal();
    await loadData();
    toast('Record updated', 'success');
  } catch (ex) {
    toast(`Error: ${ex.message}`, 'error');
  }
}

async function deleteRecord(id) {
  if (!confirm(`Delete this ${state.model} record?`)) return;
  try {
    await api(`/api/model/${state.model}/${id}`, { method: 'DELETE' });
    const row = document.getElementById(`row-${id}`);
    if (row) row.classList.add('deleted');
    toast('Record deleted', 'success');
    setTimeout(() => loadData(), 500);
  } catch (ex) {
    toast(`Error: ${ex.message}`, 'error');
  }
}

async function syncNames() {
  if (!confirm('Sync all usernames from User table to UserProgress & History?')) return;
  try {
    const res = await api('/api/sync-names', { method: 'POST' });
    toast(`Synced ${res.synced} users (${res.total} total)`, 'success');
    if (state.model) loadData();
  } catch (ex) {
    toast(`Error: ${ex.message}`, 'error');
  }
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
  state.editingId = null;
}

function safeIdStr(id) { return String(id).replace(/'/g, "\\'"); }

function toggleAll(checked) {
  state.data.forEach(r => {
    const id = safeIdStr(r.id ?? r[Object.keys(r)[0]]);
    if (checked) state.selectedIds.add(id); else state.selectedIds.delete(id);
  });
  renderTable();
}

function toggleRow(id) {
  if (state.selectedIds.has(id)) state.selectedIds.delete(id); else state.selectedIds.add(id);
  updateBulkBar();
  const cb = document.querySelector('.cb-all');
  if (cb) cb.checked = state.data.length > 0 && state.data.every(r => state.selectedIds.has(safeIdStr(r.id ?? r[Object.keys(r)[0]])));
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const count = state.selectedIds.size;
  document.getElementById('bulkCount').textContent = count;
  bar.classList.toggle('show', count > 0);
}

function clearSelection() {
  state.selectedIds.clear();
  renderTable();
}

async function bulkDelete() {
  const ids = [...state.selectedIds];
  if (!ids.length) return;
  if (!confirm(`Delete ${ids.length} records from ${state.model}?`)) return;
  try {
    await api(`/api/model/${state.model}/bulk-delete`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }),
    });
    state.selectedIds.clear();
    toast(`Deleted ${ids.length} records`, 'success');
    await loadData();
  } catch (ex) {
    toast(`Error: ${ex.message}`, 'error');
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

function closeSidebar() {
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
}

async function logout() {
  await api('/api/logout', { method: 'POST' }).catch(() => {});
  showLogin();
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 3000);
}

function showLogin() {
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

async function fetchBotStatus() {
  try {
    const res = await api('/api/bot-status');
    const dot = document.getElementById('statusDot');
    const info = document.getElementById('dbInfo');
    if (res.online) {
      dot.style.background = 'var(--green)';
      info.textContent = 'Online';
    } else {
      dot.style.background = 'var(--red)';
      info.textContent = 'Offline';
    }
  } catch {
    const dot = document.getElementById('statusDot');
    dot.style.background = 'var(--text3)';
    document.getElementById('dbInfo').textContent = 'Unknown';
  }
}

async function boot() {
  try {
    const res = await api('/api/check');
    if (res.ok) initApp();
    fetchBotStatus();
    setInterval(fetchBotStatus, 10000);
  } catch { showLogin(); }
}
boot();
</script>
</body>
</html>
